<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Havat</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="app-layout">

        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img id="server-logo" src="" alt="Logo" class="sidebar-logo">
                <h3>القوانين</h3>
            </div>

            <nav id="sidebar-nav" class="sidebar-menu">
                <!-- Nav items injected here -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            <div class="glass-panel">
                <div class="content-header-strip">
                    <h2 id="section-title">مرحباً بك</h2>
                </div>
                <div id="dynamic-content" class="markdown-body">
                    <p class="welcome-text">اختر قسماً من القائمة الجانبية لعرض القوانين.</p>
                </div>
            </div>
        </main>

    </div>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>

</html>
